<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>routecam — 軌跡プレビュー</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  :root { --bg:#1b1d21; --panel:#26292e; --fg:#e8eaed; --sub:#9aa0a6; --accent:#4c9aff; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font:14px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; }
  #map { position:absolute; inset:0; }
  #panel {
    position:absolute; left:12px; top:12px; z-index:10; width:300px; max-width:calc(100vw - 24px);
    background:var(--panel); color:var(--fg); border-radius:10px; padding:14px;
    box-shadow:0 4px 20px rgba(0,0,0,.35);
  }
  h1 { font-size:13px; margin:0 0 10px; letter-spacing:.04em; color:var(--sub); font-weight:600; }
  #stats { margin-top:10px; font-size:12px; color:var(--sub); line-height:1.7; }
  #stats b { color:var(--fg); font-weight:600; }
  .row { display:flex; gap:6px; margin-top:10px; align-items:center; }
  button { background:#363a41; color:var(--fg); border:0; border-radius:6px; padding:7px 12px; cursor:pointer; font-size:13px; }
  button:hover { background:#434852; }
  button.primary { background:var(--accent); color:#fff; min-width:72px; }
  select { background:#363a41; color:var(--fg); border:0; border-radius:6px; padding:7px; font-size:13px; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  #clock { font-variant-numeric:tabular-nums; font-size:12px; color:var(--fg); margin-top:8px; }
  .hide { display:none; }
  .maplibregl-ctrl-attrib { font-size:10px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>routecam — 軌跡プレビュー</h1>
  <div id="stats">読み込み中…</div>
  <div id="ui" class="hide">
    <input type="range" id="seek" min="0" max="1000" value="0" step="1">
    <div id="clock"></div>
    <div class="row">
      <button class="primary" id="play">再生</button>
      <select id="speed">
        <option value="1">1x</option>
        <option value="10">10x</option>
        <option value="60" selected>60x</option>
        <option value="300">300x</option>
        <option value="1000">1000x</option>
      </select>
      <button id="fit">全体</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
/* ============================================================================
   処理の全体像

   【起動時】1回だけ走る
     map.on('load')  地図の準備ができたら
       → fetch()       original/ のGPXファイルを読む
       → load()        読み込み全体の司令塔
           → parseGPX()  XMLの文字列 → 扱いやすいデータ構造に変換
           → render()    地図に「全ルートの線」「走行済みの線」「点」の
                         3つの入れ物（レイヤー）を作る ※中身はまだ空
           → update(0)   開始時刻の状態を描く

   【再生中】1秒に約60回くりかえす
     tick()          時刻を進める（どこまで進んだかを決めるだけ）
       → update()      その時刻の状態を描く
           → positionAt()  時刻 → 座標 を計算する
           → setSource()   座標を地図に渡す → MapLibreが描画

   ポイントは tick() と update() の役割分担。
   「時刻を決める人」と「その時刻を描く人」を分けてある。
   そのため時刻の決まり方が増えても update() から先は変更不要で、
     ・再生中        → tick() が自動で進める
     ・シークバー操作 → oninput が直接 update() を呼ぶ
     ・（フェーズ2）  → 動画の再生位置から時刻を出して update() を呼ぶ
   のどれでも、同じ update() を使い回せる。
   ============================================================================ */

// GPSが途切れたと判断する間隔（秒）。実データでは60秒超の欠損が58箇所あった。
// この値は「線を分ける」「点をワープさせない」「距離に加算しない」の3箇所で使う。
const GAP_SEC = 60;

const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: {
      gsi: {
        type: 'raster', tiles: ['https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png'],
        tileSize: 256, maxzoom: 18,
        attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a>'
      }
    },
    layers: [{ id: 'gsi', type: 'raster', source: 'gsi' }]
  },
  center: [142.02, 44.91], zoom: 9
});
map.addControl(new maplibregl.NavigationControl(), 'top-right');
map.addControl(new maplibregl.ScaleControl(), 'bottom-right');

// ---- アプリが覚えておく状態 ------------------------------------------------

// 読み込んだGPXのデータ。parseGPX() が作る
//   pts      … 全ての点 [{ lon, lat, t }]。t はUNIX時間（秒）
//   segments … 欠損で区切った点番号のまとまり [[0,1,2...], [58,59...]]
//   t0 / t1  … 記録の開始時刻と終了時刻（UNIX時間・秒）
let track = null;

// いま再生中の位置。「GPXの開始時刻(t0)から何秒進んだか」を表す。
// 時計から取るのではなく、このアプリが自分で進めていく数字。
let cursor = 0;

let playing = false;   // 再生中かどうか
let lastFrame = 0;     // 前フレームの時刻。経過時間を測るために使う

// 走行済みの線を描くための作業用。
// 毎フレーム全点を作り直すと重いので、進んだぶんだけ継ぎ足していく。
let travelIdx = 0;       // どの点番号まで線に追加したか
let travelCoords = [];   // 追加済みの座標。欠損の区切りには null を入れる

const $ = id => document.getElementById(id);

// ---- GPX 読み込み ---------------------------------------------------------
function parseGPX(text) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.querySelector('parsererror')) throw new Error('XMLとして読めませんでした');
  const nodes = doc.getElementsByTagName('trkpt');
  if (!nodes.length) throw new Error('trkpt が見つかりません');

  const pts = [];
  for (const n of nodes) {
    const lat = parseFloat(n.getAttribute('lat'));
    const lon = parseFloat(n.getAttribute('lon'));
    const tEl = n.getElementsByTagName('time')[0];
    if (!isFinite(lat) || !isFinite(lon) || !tEl) continue;
    const t = Date.parse(tEl.textContent); // GPXのtimeはUTC
    if (!isFinite(t)) continue;
    pts.push({ lon, lat, t: t / 1000 });
  }
  if (pts.length < 2) throw new Error('有効な点が足りません');
  pts.sort((a, b) => a.t - b.t);

  // GPSが途切れた区間で線を分ける
  const segments = [];
  let cur = [0];
  for (let i = 1; i < pts.length; i++) {
    if (pts[i].t - pts[i - 1].t > GAP_SEC) { segments.push(cur); cur = []; }
    cur.push(i);
  }
  segments.push(cur);

  return { pts, segments, t0: pts[0].t, t1: pts[pts.length - 1].t };
}

// ---- 描画 -----------------------------------------------------------------
function setSource(id, data) {
  const src = map.getSource(id);
  if (src) src.setData(data);
}

function render(t) {
  // 全ルート（欠損で分割したMultiLineString）
  const full = {
    type: 'Feature', geometry: {
      type: 'MultiLineString',
      coordinates: t.segments.filter(s => s.length > 1).map(s => s.map(i => [t.pts[i].lon, t.pts[i].lat]))
    }
  };
  const empty = { type: 'FeatureCollection', features: [] };

  if (!map.getSource('route')) {
    map.addSource('route', { type: 'geojson', data: full });
    map.addSource('travelled', { type: 'geojson', data: empty });
    map.addSource('dot', { type: 'geojson', data: empty });
    map.addLayer({ id: 'route', type: 'line', source: 'route',
      paint: { 'line-color': '#4c9aff', 'line-width': 2.5, 'line-opacity': 0.28 },
      layout: { 'line-join': 'round', 'line-cap': 'round' } });
    map.addLayer({ id: 'travelled', type: 'line', source: 'travelled',
      paint: { 'line-color': '#4c9aff', 'line-width': 4 },
      layout: { 'line-join': 'round', 'line-cap': 'round' } });
    map.addLayer({ id: 'dot-halo', type: 'circle', source: 'dot',
      paint: { 'circle-radius': 11, 'circle-color': '#4c9aff', 'circle-opacity': 0.25 } });
    map.addLayer({ id: 'dot', type: 'circle', source: 'dot',
      paint: { 'circle-radius': 6, 'circle-color': '#fff', 'circle-stroke-color': '#2b6fd6', 'circle-stroke-width': 3 } });
  } else {
    setSource('route', full);
    setSource('travelled', empty);
    setSource('dot', empty);
  }
  fitBounds();
}

function fitBounds() {
  if (!track) return;
  const b = new maplibregl.LngLatBounds();
  for (const p of track.pts) b.extend([p.lon, p.lat]);
  map.fitBounds(b, { padding: { top: 40, bottom: 40, left: 330, right: 40 }, duration: 600 });
}

// 2点間の距離（m）
function distance(a, b) {
  const R = 6371008.8, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad;
  const dLon = (b.lon - a.lon) * rad;
  const la = a.lat * rad, lb = b.lat * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(la) * Math.cos(lb) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

// 走行距離（m）。GPSが途切れた区間は経路が分からないため加算しない
function totalDistance(t) {
  let m = 0;
  for (const seg of t.segments)
    for (let k = 1; k < seg.length; k++)
      m += distance(t.pts[seg[k - 1]], t.pts[seg[k]]);
  return m;
}

// 時刻 → 位置（点と点のあいだは線形補間）
// この関数が同期処理の心臓部。
// 「開始から sec 秒後」に車がいた座標を返す。
// GPXの点は1秒おきにしか無いので、点と点のあいだは直線で補って滑らかに見せる。
// 戻り値 { lon, lat, idx }。idx は「通過済みの最後の点番号」
function positionAt(sec) {
  const pts = track.pts;
  const abs = track.t0 + sec;   // 相対秒 → 実際のUNIX時間に直す

  // 【1】該当する点を二分探索で探す
  //   16,303点を先頭から順に見ると遅いので、範囲を半分ずつ絞り込む。
  //   16,303点でも14回ほどの比較で見つかる。
  //   終了時 lo は「時刻 abs 以降で最初の点」の番号になる。
  let lo = 0, hi = pts.length - 1;
  while (lo < hi) {
    const m = (lo + hi) >> 1;        // >>1 は「2で割って切り捨て」の速い書き方
    if (pts[m].t < abs) lo = m + 1;  // まだ手前 → 後ろ半分を探す
    else hi = m;                     // 行き過ぎ → 前半分を探す（m自身は残す）
  }

  // 【2】求めた点と、その1つ手前の点を取り出す。
  //   車はこの2点のあいだのどこかにいる。
  const i = Math.max(1, lo);   // lo が 0 だと a が作れないので最低1にする
  const a = pts[i - 1];        // 手前の点
  const b = pts[i];            // 次の点
  const span = b.t - a.t;      // 2点の時間差（秒）

  // 【3】欠損区間（2点が離れすぎ）なら、補間せず手前の点に留める。
  //   ここで補間すると、23分の空白を直線で突っ切る「ワープ」になってしまう。
  if (span > GAP_SEC) return { lon: a.lon, lat: a.lat, idx: i - 1 };

  // 【4】線形補間：a と b のあいだのどこにいるかを 0〜1 の比率で求め、
  //   その比率ぶんだけ a から b へ寄せた座標を返す。
  //   例）a が 10秒、b が 12秒、いま 11秒 → r = 0.5 → ちょうど中間地点
  const r = span > 0 ? (abs - a.t) / span : 0;
  return {
    lon: a.lon + (b.lon - a.lon) * r,
    lat: a.lat + (b.lat - a.lat) * r,
    idx: i - 1
  };
}

// 「指定された時刻の状態」を画面に描く。
// 再生中・シークバー操作・読み込み直後、どこから呼ばれても同じ処理をする。
// 時刻をどう決めるかはこの関数の外側（tick / oninput）の仕事。
function update(sec) {

  // 【1】時刻を確定する。0 未満や記録の終端を超えないように丸める
  cursor = Math.max(0, Math.min(sec, track.t1 - track.t0));

  // 【2】その時刻の座標を求める
  const pos = positionAt(cursor);

  // 【3】走行済みの線を伸ばす
  //   毎フレーム16,303点を作り直すと重いので、前回から進んだぶんだけ追加する。
  //   シークバーで巻き戻された時（進んだ先より手前に戻った時）だけ、
  //   作り直しになるので空にしてやり直す。
  if (pos.idx < travelIdx) { travelIdx = 0; travelCoords = []; }
  while (travelIdx <= pos.idx) {
    const p = track.pts[travelIdx];
    const prev = track.pts[travelIdx - 1];
    // 欠損をまたぐ所には目印として null を入れ、線が繋がらないようにする
    if (prev && p.t - prev.t > GAP_SEC) travelCoords.push(null);
    travelCoords.push([p.lon, p.lat]);
    travelIdx++;
  }

  // 【4】null を区切りにして、座標の列を「線の集まり」に切り分ける。
  //   [a, b, null, c, d] → [[a, b], [c, d]] という形にする。
  //   末尾に null を足しているのは、最後の線も忘れず取り出すための目印。
  const lines = [];
  let run = [];                                  // 組み立て中の1本の線
  for (const c of travelCoords.concat([null])) {
    if (c === null) {                            // 区切りに来た
      if (run.length > 1) lines.push(run);       // 点1つだけの線は捨てる
      run = [];
    } else {
      run.push(c);
    }
  }

  // 【5】最後の線の先端に、いまの座標（点と点のあいだの補間位置）を足す。
  //   これが無いと、線が点より最大1秒ぶん遅れてカクカクして見える。
  const tail = lines.length ? lines[lines.length - 1] : null;
  if (tail) tail.push([pos.lon, pos.lat]);

  // 【6】できた図形をMapLibreに渡す。あとはMapLibreが勝手に描いてくれる
  setSource('travelled', { type: 'Feature', geometry: { type: 'MultiLineString', coordinates: lines } });
  setSource('dot',       { type: 'Feature', geometry: { type: 'Point', coordinates: [pos.lon, pos.lat] } });

  // 【7】シークバーの位置と時刻表示を合わせる。
  //   シークバーは 0〜1000 の目盛りなので、全体に対する割合に直して入れる。
  const total = track.t1 - track.t0;
  $('seek').value = Math.round(cursor / total * 1000);
  const d = new Date((track.t0 + cursor) * 1000);   // UNIX秒 → Dateはミリ秒なので1000倍
  $('clock').textContent =
    d.toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo', hour12: false }) + ' JST';
}

const fmt = s => {
  s = Math.round(s);
  return `${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor(s/60)%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
};

// ---- 再生ループ -----------------------------------------------------------
// requestAnimationFrame により、画面の更新に合わせて1秒に約60回呼ばれる。
// この関数の仕事は「時刻をどこまで進めるか」を決めることだけ。
// 実際に描くのは update() の役目。
// 引数 now はブラウザが渡してくる「ページ表示開始からの経過ミリ秒」。
function tick(now) {
  if (playing && track) {

    // 前フレームからの実際の経過秒。
    // フレーム数ではなく時間で計算するので、
    // 処理が重くて frame が飛んでも再生速度が遅くならない。
    const dt = (now - lastFrame) / 1000;

    // 実時間の経過 × 再生倍率 = ドライブ上で進む秒数。
    // 60倍速なら、実時間1秒につきドライブの時刻が60秒進む。
    const next = cursor + dt * Number($('speed').value);

    if (next >= track.t1 - track.t0) {
      update(track.t1 - track.t0);   // 終端ぴったりで止める
      setPlaying(false);
    } else {
      update(next);                  // その時刻の状態を描いてもらう
    }
  }
  lastFrame = now;
  requestAnimationFrame(tick);   // 次のフレームでも自分を呼んでもらう
}

// 最初の1回。あとは tick() の中から自動でくりかえされる
requestAnimationFrame(tick);

function setPlaying(v) {
  playing = v;
  $('play').textContent = v ? '一時停止' : '再生';
}

// ---- 入力 -----------------------------------------------------------------
function load(text, label) {
  try {
    track = parseGPX(text);
    travelIdx = 0; travelCoords = [];
    const total = track.t1 - track.t0;
    const km = totalDistance(track) / 1000;
    $('stats').innerHTML =
      `<b>${label}</b><br>` +
      `走行距離 <b>${km.toFixed(1)} km</b>　記録時間 <b>${fmt(total)}</b><br>` +
      `点の数 <b>${track.pts.length.toLocaleString()}</b>`;
    $('ui').classList.remove('hide');
    render(track);
    setPlaying(false);
    update(0);
  } catch (e) {
    $('stats').innerHTML = `<b style="color:#ff8080">読み込めませんでした</b><br>${e.message}`;
  }
}

$('play').onclick = () => { if (track) setPlaying(!playing); };
$('fit').onclick = fitBounds;
$('seek').oninput = e => { if (track) update(Number(e.target.value) / 1000 * (track.t1 - track.t0)); };
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && track) { e.preventDefault(); setPlaying(!playing); }
});

// 読み込むGPX（original/ に置いたデータを直接読む）
const GPX_PATH = 'original/Log20260925-082845.gpx';

map.on('load', () => {
  fetch(GPX_PATH)
    .then(r => r.ok ? r.text() : Promise.reject(new Error(`${r.status} ${r.statusText}`)))
    .then(t => load(t, GPX_PATH.split('/').pop()))
    .catch(e => {
      $('stats').innerHTML =
        `<b style="color:#ff8080">GPXを読み込めませんでした</b><br>` +
        `${GPX_PATH}<br>${e.message}`;
    });
});
</script>
</body>
</html>
